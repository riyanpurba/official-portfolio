server {
  listen 80;
  server_name riyanpurba.com;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed files here, safe to cache for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
